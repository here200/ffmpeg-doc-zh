name: Deploy static HTML to GitHub Pages

on:
  # 推送到 main 分支时自动触发
  push:
    branches: ["main"]
  # 允许在 Actions 标签页手动触发
  workflow_dispatch:

# 授予 GITHUB_TOKEN 部署到 GitHub Pages 所需的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 只允许一个并发部署，跳过队列中的重复运行
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 单部署任务，因为只是上传静态文件
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          # 上传整个仓库作为静态站点
          # 如果你的 HTML 文件在某个子目录（如 docs/ 或 public/），改为对应路径
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4